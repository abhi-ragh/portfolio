name: Staging (Preview) Deployment

on:
  push:
    branches:
      - staging

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: |
          vercel pull \
            --yes \
            --environment=preview \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Cache Notion images
        run: npm run cache:notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_PROJECTS_ID: ${{ secrets.NOTION_PROJECTS_ID }}

      - name: Verify Notion image cache
        run: |
          echo "Checking public/notion-assets..."

          if [ ! -d "public/notion-assets" ]; then
            echo "ERROR: public/notion-assets directory does not exist."
            exit 1
          fi

          FILE_COUNT=$(find public/notion-assets -type f | wc -l)

          echo "Cached image files: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No Notion images were cached."
            exit 1
          fi

          echo "Cached files:"
          find public/notion-assets -maxdepth 1 -type f -print

      - name: Build Vercel application
        run: |
          vercel build \
          --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Preview
        run: |
          vercel deploy \
          --prebuilt \
          --token=${{ secrets.VERCEL_TOKEN }}
