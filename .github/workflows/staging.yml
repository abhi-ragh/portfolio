name: Staging (Preview) Deployment

on:
  push:
    branches:
      - staging

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: |
          vercel pull \
            --yes \
            --environment=preview \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Test Vercel Notion token
        run: |
          TOKEN=$(grep '^NOTION_TOKEN=' .vercel/.env.preview.local | cut -d= -f2-)

          TOKEN="${TOKEN%\"}"
          TOKEN="${TOKEN#\"}"
          echo $TOKEN
          HTTP_CODE=$(curl -s \
            -o /tmp/notion-response.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            https://api.notion.com/v1/users/me)

          echo "Notion authentication HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Notion authentication failed"
            exit 1
          fi

          echo "Notion authentication succeeded"

      - name: Build Vercel application
        run: |
          vercel build \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Preview
        run: |
          vercel deploy \
            --prebuilt \
            --token=${{ secrets.VERCEL_TOKEN }}