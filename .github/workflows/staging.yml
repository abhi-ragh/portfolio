name: Staging (Preview) Deployment

on:
  push:
    branches:
      - staging

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: |
          vercel pull \
            --yes \
            --environment=preview \
            --token=${{ secrets.VERCEL_TOKEN }}

          cp .vercel/.env.preview.local .env

          set -a
          source .env
          set +a

      - name: Verify Notion environment
        run: |
          test -n "$NOTION_TOKEN" || {
            echo "ERROR: NOTION_TOKEN is not available"
            exit 1
          }

          test -n "$NOTION_DATABASE_ID" || {
            echo "ERROR: NOTION_DATABASE_ID is not available"
            exit 1
          }

          test -n "$NOTION_PROJECTS_ID" || {
            echo "ERROR: NOTION_PROJECTS_ID is not available"
            exit 1
          }

          echo "Notion environment variables are available."

      - name: Cache Notion images
        run: npm run cache:notion

      - name: Verify Notion image cache
        run: |
          echo "Checking public/notion-assets..."

          if [ ! -d "public/notion-assets" ]; then
            echo "ERROR: public/notion-assets directory does not exist."
            exit 1
          fi

          FILE_COUNT=$(find public/notion-assets -type f | wc -l)

          echo "Cached image files: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No Notion images were cached."
            exit 1
          fi

          echo ""
          echo "Cached files:"
          find public/notion-assets -maxdepth 1 -type f -print

      - name: Build Vercel application
        run: |
          vercel build \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verify Vercel build assets
        run: |
          echo "Checking Vercel build output..."

          if [ ! -d ".vercel/output/static/notion-assets" ]; then
            echo "ERROR: Notion assets are missing from Vercel build output."
            exit 1
          fi

          FILE_COUNT=$(find .vercel/output/static/notion-assets -type f | wc -l)

          echo "Notion images in Vercel output: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: Vercel build contains no Notion images."
            exit 1
          fi

      - name: Deploy to Vercel Preview
        run: |
          vercel deploy \
            --prebuilt \
            --token=${{ secrets.VERCEL_TOKEN }}
